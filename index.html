  <style>

fr));gap:12px}.card{position:relative;padding:0;border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden;text-align:left;color:inherit;cursor:pointer;min-height:250px;transition:transform .18s,border-color .18s}.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--lime);outline:none}.thumb{height:168px;display:grid;place-items:end start;padding:14px;background-size:cover;background-position:center;position:relative}.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,#12161f)}.play{position:relative;z-index:1;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--lime);color:#0d1100;font-size:16px;padding-left:2px}.card-text{padding:0 14px 16px}.card small{color:var(--lime);font-size:11px;letter-spacing:.11em;font-weight:800}.card h3{font-size:16px;margin:5px 0 4px;line-height:1.15}.card p{font-size:12px;color:var(--muted);margin:0;line-height:1.35}.footer{border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:16px}.modal{position:fixed;inset:0;z-index:20;display:none;padding:clamp(14px,4vw,50px);background:#06070bdf;backdrop-filter:blur(8px)}.modal.open{display:grid;place-items:center}.modal-box{width:min(1120px,100%);max-height:100%;overflow:auto;background:#11151d;border:1px solid #394252;border-radius:18px;box-shadow:0 30px 100px #000;padding:clamp(18px,3vw,32px);position:relative}.close{position:absolute;right:16px;top:15px;border:0;background:#252b35;color:#fff;border-radius:50%;width:40px;height:40px;font-size:23px;cursor:pointer}.modal-title{font-size:clamp(28px,4vw,52px);letter-spacing:-.06em;margin:0 54px 5px 0}.modal-type{color:var(--lime);font-weight:800;font-size:13px;letter-spacing:.12em}.modal-content{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(245px,.7fr);gap:25px;margin-top:23px}.video{aspect-ratio:16/9;background:#050609;border-radius:10px;overflow:hidden}.video iframe{width:100%;height:100%;border:0}.steps{margin:0;padding:0;list-style:none;counter-reset:steps}.steps li{position:relative;padding:0 0 17px 41px;color:#d9dde2}.steps li:before{counter-increment:steps;content:counter(steps);position:absolute;left:0;top:-2px;width:27px;height:27px;border-radius:50%;background:var(--lime);color:#101300;display:grid;place-items:center;font-weight:900;font-size:12px}.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:15px}.locale{display:flex;gap:6px}.locale button{color:#bbc2cc;background:none;border:0;cursor:pointer;font:700 12px inherit;padding:4px}.locale button.on{color:var(--lime)}@media(max-width:950px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{align-items:start;flex-direction:column}.event{display:none}}@media(max-width:570px){.shell{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{min-height:214px}.thumb{height:130px}.modal-content{grid-template-columns:1fr}.footer{flex-direction:column}.hero h1{font-size:51px}}

<body>
  <main class="shell">
    <nav class="tabs" aria-label="Product categories"><button class="tab active" data-category="exterior">EXTERIOR · CLEAN &amp; SHINE</button><button class="tab" data-category="interior">INTERIOR · CLEAN &amp; CARE</button></nav>
    <section class="catalogue"><div class="catalogue-head"><h2 id="category-name">All products</h2><span class="count" id="count"></span></div><div class="grid" id="grid"></div></section>
    <footer class="footer"><span>GLOSSBRO · Made for the detailing ritual</span><span>For distribution enquiries: Please speak with our booth team.</span></footer>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><article class="modal-box"><button class="close" id="close" aria-label="Close">×</button><div class="modal-type" id="modal-type"></div><h2 class="modal-title" id="modal-title"></h2><div class="modal-content"><div class="video"><iframe id="player" title="Product source" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe><div class="source-panel">SOURCES<a class="channel-source" href="https://www.youtube.com/@GLOSSBRO" target="_blank" rel="noopener">GLOSSBRO OFFICIAL CHANNEL ↗</a><a class="channel-source" href="https://www.youtube.com/@GLOSSBRO_global" target="_blank" rel="noopener">GLOSSBRO_global CHANNEL ↗</a></div></div><div><p class="eyebrow">How to use</p><ol class="steps" id="steps"></ol><p class="note" id="note"></p></div></div></article></div>
  <script>
    const data=[
      ['exterior','APPLE CRUSH','Citrus pre-wash','Spray · dwell · rinse','Pre-wash away traffic film and road grime before contact washing.'],['exterior','PEACH CRUSH','Alkaline pre-wash','Spray · dwell · rinse','Target heavier dirt before shampooing.'],['exterior','ORANGE CRUSH RTU','pH-neutral pre-wash','Spray · dwell · rinse','Ready-to-use gentle pre-wash for regular maintenance.'],['exterior','LIME BOMB','Car shampoo','Dilute · wash · rinse','Lubricated contact wash for a clean, clear finish.'],['exterior','BLOODIRON','Iron fallout remover','Spray · react · rinse','Remove embedded iron contamination safely.'],['exterior','TAR OFF','Tar remover','Spray · wipe · rinse','Dissolve stubborn tar spots before protection.'],['exterior','PURE GLASS','Glass cleaner','Spray · wipe · buff','Crystal-clear vision, inside and out.'],['exterior','RAIN SHIELD ULTRA','Glass water repellent','Apply · cure · buff','Hydrophobic protection for clearer wet-weather driving.'],['exterior','SPEED WIPE','Quick detailer','Mist · wipe · finish','Fast gloss revival between washes.'],['exterior','DURA COAT PLUS','Paint coating','Apply · level · cure','Durable gloss and surface protection.'],['exterior','CERA COAT','Ceramic quick coating','Spray · spread · buff','Instant beading and a high-gloss final layer.'],['exterior','CREAM COAT','Cream wax','Apply · haze · buff','Rich depth and a warm, tactile finish.'],['exterior','FUNKY BLACK','Tire & trim coat','Apply · spread · dry','Refresh dark rubber and exterior trim.'],['exterior','DEEP BLACK','Tire & trim coating','Apply · layer · buff','Build a deep, protected black finish.'],['exterior','GLOSS BLACK','Trim & tire coat','Spray · even · set','Easy spray gloss with UV and anti-static care.'],
      ['interior','CABIN CLEAN','Interior cleaner','Spray · wipe · dry','Clean cabin surfaces without a greasy residue.'],['interior','INNER SHINE','Interior detailer','Apply · wipe · buff','Restore a clean, refined finish to trim and plastics.'],['interior','LEATHER CLEAN','Leather cleaner','Apply · brush · wipe','Clean leather gently before conditioning.'],['interior','LEATHER PROTECTOR','Leather protector & conditioner','Apply · spread · cure','Condition and protect clean leather with a soft, natural finish.'],['interior','QUICK REFRESH','Air refresh · Cabin deodorizer','Place · activate · refresh','A compact air-refresh treatment for a clean-feeling cabin.']
    ].map(x=>({category:x[0],name:x[1],sub:x[2],steps:x[3].split(' · '),note:x[4]}));
    const labels={exterior:'Exterior · Clean & shine',interior:'Interior · Clean & care'}; let active='exterior', lang='en';
    const copy={en:{intro:'Tap a product for its use case and product information. Sources: GLOSSBRO official channels.',use:'How to use',note:'Sources: GLOSSBRO official channel and GLOSSBRO_global.'},de:{intro:'Tippen Sie auf ein Produkt für Einsatzbereich und Produktinformationen. Quellen: offizielle GLOSSBRO-Kanäle.',use:'Anwendung',note:'Quellen: offizieller GLOSSBRO-Kanal und GLOSSBRO_global.'},ko:{intro:'제품을 터치하면 사용법과 제품 정보를 보여드립니다. 자료 출처: GLOSSBRO 공식 채널.',use:'사용 방법',note:'자료 출처: GLOSSBRO 공식 채널 및 GLOSSBRO_global.'}};
    const grid=document.querySelector('#grid'),modal=document.querySelector('#modal'); function render(){const items=data.filter(p=>active==='all'||p.category===active);document.querySelector('#category-name').textContent=labels[active];document.querySelector('#count').textContent=`${items.length} PRODUCTS`;grid.innerHTML=items.map((p,i)=>`<button class="card" data-id="${data.indexOf(p)}"><span class="thumb"></span><span class="card-text"><small>${p.category.toUpperCase()}</small><h3>${p.name}</h3><p>${p.sub}</p></span></button>`).join('')};
    document.querySelector('.tabs').addEventListener('click',e=>{let b=e.target.closest('.tab');if(!b)return;document.querySelector('.tab.active').classList.remove('active');b.classList.add('active');active=b.dataset.category;render()});grid.addEventListener('click',e=>{let c=e.target.closest('.card');if(!c)return;let p=data[c.dataset.id];document.querySelector('#modal-type').textContent=`GLOSSBRO · ${p.category.toUpperCase()}`;document.querySelector('#modal-title').textContent=p.name;document.querySelector('#steps').innerHTML=p.steps.map(s=>`<li>${s}</li>`).join('');document.querySelector('#note').textContent=copy[lang].note;document.querySelector('.modal-box .eyebrow').textContent=copy[lang].use;document.querySelector('#player').src='';modal.classList.remove('video-fullscreen');modal.classList.add('open');document.body.style.overflow='hidden'});function close(){modal.classList.remove('open','video-fullscreen');document.querySelector('#player').src='';document.body.style.overflow=''}document.querySelector('#close').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
  </script>
  <style>

      'QUICK REFRESH':'https://en.glossbro.com/web/product/medium/202412/0e4532e38f509994d9b94e9da02efecb.jpg'
    };
    function decorateCards(){document.querySelectorAll('.card').forEach(card=>{const product=data[card.dataset.id],thumb=card.querySelector('.thumb'),photo=productImages[product.name];thumb.className='thumb product-identity';thumb.removeAttribute('style');thumb.innerHTML=photo?`<img class="official-product-photo" src="${photo}" alt="GLOSSBRO ${product.name}">`:`<span class="photo-pending">GLOSSBRO<br><b>${product.name}</b><small>PHOTO BEING VERIFIED</small></span>`})}decorateCards();document.querySelector('.tabs').addEventListener('click',()=>requestAnimationFrame(decorateCards));
  </script>
  <script>
    /* Long-form videos from the two official GLOSSBRO channels. */

      'ORANGE CRUSH RTU':{id:'XqhDnWsWxZ0',label:'GLOSSBRO ORANGE CRUSH'},
      'LIME BOMB':{id:'JAeAtw8Fj7U',label:'GLOSSBRO LIME BOMB'},

      'CERA COAT':{id:'5N1lHTg-V5o',label:'GLOSSBRO_global CERA COAT'},

      'CABIN CLEAN':{id:'kMHyStKoktE',label:'GLOSSBRO_global CABIN CLEAN & INNER SHINE'},
      'INNER SHINE':{id:'kMHyStKoktE',label:'GLOSSBRO_global CABIN CLEAN & INNER SHINE'},

    function markChannelVideoAvailability(){document.querySelectorAll('.card').forEach(card=>{const product=data[card.dataset.id],available=Boolean(channelVideos[product.name]),thumb=card.querySelector('.thumb');thumb.querySelector('.video-status')?.remove();thumb.insertAdjacentHTML('beforeend',`<span class="video-status ${available?'available':'unavailable'}">${available?'VIDEO AVAILABLE':'NO VIDEO FOUND'}</span>`);});}
    document.querySelector('#grid').addEventListener('click',event=>{const card=event.target.closest('.card');if(!card)return;const product=data[card.dataset.id],video=channelVideos[product.name];if(!video)return;setTimeout(()=>{document.querySelector('#player').src=`https://www.youtube.com/embed/${video.id}?rel=0&autoplay=1&playsinline=1`;document.querySelector('#note').textContent=`Source: GLOSSBRO official channel · ${video.label}`;document.querySelector('#modal').classList.add('video-fullscreen');},0);});
    markChannelVideoAvailability();document.querySelector('.tabs').addEventListener('click',()=>requestAnimationFrame(markChannelVideoAvailability));
