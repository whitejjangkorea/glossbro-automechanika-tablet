const format=n=>n.toLocaleString('ko-KR'),cart=new Map(),grid=document.querySelector('#product-grid'),list=document.querySelector('#order-list'),app=document.querySelector('#app'),toast=document.querySelector('#toast');
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),1800)}
function renderProducts(){grid.innerHTML=products.map((p,i)=>{const q=cart.get(i)||0;return `<button class="product-card ${q?'is-selected':''}" type="button" data-index="${i}"><span class="product-number">${p.number}</span>${q?`<span class="quantity-badge">${q}</span>`:''}<span class="image-wrap"><img src="/assets/event/${p.image}" alt="${p.name}" loading="lazy"></span><span class="product-info"><span class="product-kind">${p.kind}</span><strong>${p.name}</strong><span class="regular-price">정가 <del>${format(p.regular)}원</del></span><em class="discount-rate">20% 할인</em><b><span>판매가</span>${format(p.sale)}원</b></span></button>`}).join('')}
function renderOrder(){const entries=[...cart.entries()].filter(([,q])=>q),qty=entries.reduce((s,[,q])=>s+q,0),total=entries.reduce((s,[i,q])=>s+products[i].sale*q,0);document.querySelector('#order-types').textContent=`${entries.length}종`;document.querySelector('#quantity-total').textContent=`${qty}개`;document.querySelector('#price-total').innerHTML=`${format(total)}<small>원</small>`;document.querySelector('#confirm-order').disabled=!qty;if(!entries.length){list.className='order-list is-empty';list.innerHTML='<div class="empty-order"><span aria-hidden="true">+</span><strong>상품을 선택해주세요</strong><p>왼쪽 상품 카드를 터치하면<br>이곳에 주문이 표시됩니다.</p></div>';return}list.className='order-list';list.innerHTML=entries.map(([i,q])=>{const p=products[i];return `<div class="order-row"><div><strong>${p.name}</strong><small>${format(p.sale)}원 · ${format(p.sale*q)}원</small></div><div class="order-controls"><button type="button" data-change="-1" data-index="${i}" aria-label="수량 줄이기">−</button><span>${q}</span><button type="button" data-change="1" data-index="${i}" aria-label="수량 늘리기">+</button></div></div>`}).join('')}
